    .canvas { fill: var(--cds-surface-1, #fcfcfb); }
    .primary { fill: var(--cds-text-primary, #0b0b0b); }
    .arrow { fill: var(--cds-clay, #d97757); }
    .loop { stroke: var(--cds-clay, #d97757); stroke-width: 8.6; fill: none; }
    .callout { stroke: var(--cds-clay, #d97757); stroke-width: 2.7; stroke-linejoin: round; fill: none; }
    /* Icons: outlines in the text color; a shape that lies on top of another is filled with the background color */
    .icon { stroke: var(--cds-text-primary, #0b0b0b); stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .on-top { fill: var(--cds-surface-1, #fcfcfb); }
    .sharp { stroke-linecap: butt; stroke-linejoin: miter; }
    .pass { stroke: var(--cds-fill-success, #009300); stroke-width: 2.3; }
    .fail { stroke: var(--cds-fill-danger, #d03b3b); stroke-width: 2; }
    /* Labels are HTML text in an area, so that a longer translation wraps inside it */
    :where(foreignObject) { overflow: visible; }
    .area { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; padding: 4px 6px; }
    .area.center { justify-content: center; text-align: center; }
    .area.top { align-items: flex-start; }
    .area.bottom { align-items: flex-end; }
    /* The six step labels are centered on one line, y 55, so that a translation with more or fewer lines stays level with the others. Areas 3 and 4 end 4 units above the loop. Each area is about as wide as the longest word in any translation of its label, so that the text of neighbouring labels stays apart and does not read as one phrase. Areas 3 and 6 are wider than that, because in areas that narrow some translations of their labels take an extra line with a single word on it */
    .area.pad-y-0 { padding-top: 0; padding-bottom: 0; }
    .label { line-height: 1.3; overflow-wrap: anywhere; }
    /* Only translations hyphenate, and only words of 10 or more letters, with 5 on each side of the hyphen. They also try to avoid a single word on their last line. A translated copy has its language on the root. */
    .label:not(:lang(en)) { hyphens: auto; hyphenate-limit-chars: 10 5 5; -webkit-hyphenate-limit-before: 5; -webkit-hyphenate-limit-after: 5; }
    .label:not(:lang(en)):not(.balance) { text-wrap: pretty; }
    /* Firefox has no text-wrap: pretty. There a translation balances its lines instead, which also keeps a single word off its last line, and has no automatic hyphens. */
    @supports not (text-wrap: pretty) { .label:not(:lang(en)) { hyphens: manual; } .label:not(:lang(en)):not(.balance) { text-wrap: balance; } }
    .label.balance-translation:not(:lang(en)) { text-wrap: balance; } /* a translated label with lines of about the same length */
    .label .mono, .label .code { hyphens: none; overflow-wrap: normal; }
    /* Chinese, Japanese and Korean labels break lines only at spaces and punctuation, and at the zero-width spaces that the docs translator adds to Chinese and Japanese text */
    .label:is(:lang(ja), :lang(ko), :lang(zh)) { word-break: keep-all; }
    /* Chinese, Japanese and Korean fonts have no italics, so the browser would slant the glyphs. This overrides the diagram's italic classes. */
    :is(:lang(ja), :lang(ko), :lang(zh)) { font-style: normal !important; }
    .label.primary { color: var(--cds-text-primary, #0b0b0b); }
    /* Line heights of labels whose lines were drawn closer or farther apart than 1.3 (lh-N is N/100) */
    .lh-127 { line-height: 1.27; }
    .lh-128 { line-height: 1.28; }
    /* On a label: lines of about the same length */
    .balance { text-wrap: balance; }
    /* The English keeps the line width it was drawn with; a translation may use the whole area */
    .en-184:lang(en) { max-width: 184.3px; }
