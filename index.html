<style>
/* ============================================================
   DESIGN TOKENS — 8pt grid, fluid type, semantic colors
   ============================================================ */
:root {
  /* Color — dark mode (default) */
  --bg-base:        #0a0b10;
  --bg-surface:     #13151c;
  --bg-elevated:    #1a1d26;
  --bg-overlay:     rgba(10, 11, 16, 0.85);

  --border-subtle:  #1f222d;
  --border-default: #2a2e3a;
  --border-strong:  #3a3f4f;

  --text-primary:   #f0f2f8;
  --text-secondary: #b4b8c7;
  --text-tertiary:  #808596;
  --text-quat:      #5a5f72;

  --accent:         #a5b4fc;          /* indigo-300 */
  --accent-2:       #c4b5fd;          /* violet-300 */
  --accent-3:       #7dd3fc;          /* sky-300 */
  --accent-soft:    rgba(165, 180, 252, 0.12);
  --accent-glow:    rgba(165, 180, 252, 0.25);

  --cat-ai:         #c084fc;
  --cat-eda:        #38bdf8;
  --cat-security:   #fb923c;
  --cat-tool:       #4ade80;
  --cat-finance:    #f472b6;
  --cat-default:    #94a3b8;

  --grad-text:      linear-gradient(135deg, #a5b4fc 0%, #c4b5fd 45%, #7dd3fc 100%);
  --grad-glow:      radial-gradient(ellipse at top, rgba(165,180,252,0.12), transparent 60%);

  /* Shadow */
  --shadow-sm:      0 1px 2px rgba(0,0,0,0.25);
  --shadow-md:      0 4px 16px rgba(0,0,0,0.30);
  --shadow-lg:      0 16px 48px rgba(0,0,0,0.45);
  --shadow-glow:    0 0 0 1px var(--accent-glow), 0 8px 32px rgba(165,180,252,0.10);

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-xl: 24px;

  /* Spacing — 8pt grid */
  --s-1: 0.25rem;
  --s-2: 0.5rem;
  --s-3: 0.75rem;
  --s-4: 1rem;
  --s-5: 1.25rem;
  --s-6: 1.5rem;
  --s-8: 2rem;
  --s-10: 2.5rem;
  --s-12: 3rem;
  --s-16: 4rem;
  --s-20: 5rem;
  --s-24: 6rem;

  /* Type — fluid scale */
  --fs-xs:   clamp(0.75rem, 0.7rem + 0.2vw, 0.8125rem);
  --fs-sm:   clamp(0.8125rem, 0.78rem + 0.2vw, 0.875rem);
  --fs-base: clamp(0.9375rem, 0.9rem + 0.2vw, 1rem);
  --fs-lg:   clamp(1.05rem, 1rem + 0.3vw, 1.15rem);
  --fs-xl:   clamp(1.2rem, 1.1rem + 0.5vw, 1.4rem);
  --fs-2xl:  clamp(1.4rem, 1.25rem + 0.8vw, 1.7rem);
  --fs-3xl:  clamp(1.75rem, 1.4rem + 1.8vw, 2.5rem);
  --fs-4xl:  clamp(2.2rem, 1.6rem + 3vw, 3.5rem);
  --fs-5xl:  clamp(2.8rem, 2rem + 4vw, 4.5rem);

  --lh-tight:  1.15;
  --lh-snug:   1.35;
  --lh-base:   1.6;
  --lh-relax:  1.75;

  /* Type families */
  --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-sans:  'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:  'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* Layout */
  --container:  min(1180px, 100% - 2.5rem);
  --container-reading: min(720px, 100% - 2.5rem);

  /* Motion */
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast:      150ms;
  --t-med:       280ms;
  --t-slow:      500ms;
}

[data-theme="light"] {
  --bg-base:        #fafaf7;
  --bg-surface:     #ffffff;
  --bg-elevated:    #f5f5f1;
  --bg-overlay:     rgba(250, 250, 247, 0.85);
  --border-subtle:  #ececea;
  --border-default: #dcdcd8;
  --border-strong:  #c5c5c0;
  --text-primary:   #1a1a1f;
  --text-secondary: #4a4a55;
  --text-tertiary:  #6b6b78;
  --text-quat:      #94949f;
  --accent-soft:    rgba(99, 102, 241, 0.10);
  --shadow-sm:      0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:      0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg:      0 16px 48px rgba(0,0,0,0.10);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  color: var(--text-primary);
  background: var(--bg-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background-color var(--t-med) var(--ease-out), color var(--t-med) var(--ease-out);
}
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input, textarea { font: inherit; color: inherit; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}
::selection { background: var(--accent-soft); color: var(--text-primary); }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.shell {
  width: var(--container);
  margin-inline: auto;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  width: 100%;
  background: var(--bg-overlay);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  transition: background-color var(--t-med) var(--ease-out);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  height: 64px;
}
.nav__logo {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: var(--fs-lg);
  color: var(--text-primary);
  letter-spacing: -0.01em;
  transition: color var(--t-fast) var(--ease-out);
}
.nav__logo:hover { color: var(--accent); }
.nav__logo-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--grad-text);
  font-size: 1.1rem;
  line-height: 1;
}
.nav__actions { display: inline-flex; align-items: center; gap: var(--s-2); }
.nav__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  color: var(--text-secondary);
  transition: background-color var(--t-fast), color var(--t-fast);
}
.nav__btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.nav__btn svg { width: 18px; height: 18px; }
.nav__link {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: 0 var(--s-3);
  height: 36px;
  border-radius: 8px;
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  transition: background-color var(--t-fast), color var(--t-fast);
}
.nav__link:hover { background: var(--bg-elevated); color: var(--text-primary); }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  position: relative;
  padding: var(--s-20) 0 var(--s-12);
  text-align: center;
  isolation: isolate;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: -10% 0 0 0;
  z-index: -1;
  background: var(--grad-glow);
  pointer-events: none;
}
.hero__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-1) var(--s-3);
  margin-bottom: var(--s-6);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent);
  border-radius: 9999px;
  letter-spacing: 0.05em;
}
.hero__eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}
.hero__title {
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: var(--fs-5xl);
  line-height: var(--lh-tight);
  letter-spacing: -0.04em;
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: var(--s-4);
}
.hero__subtitle {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--text-tertiary);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: var(--s-8);
}
.hero__search {
  max-width: 540px;
  margin: 0 auto;
  position: relative;
}
.hero__search input {
  width: 100%;
  height: 52px;
  padding: 0 var(--s-4) 0 calc(var(--s-12) + 4px);
  font-size: var(--fs-base);
  color: var(--text-primary);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  transition: border-color var(--t-fast), background-color var(--t-fast), box-shadow var(--t-fast);
}
.hero__search input::placeholder { color: var(--text-quat); }
.hero__search input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.hero__search-icon {
  position: absolute;
  left: var(--s-4);
  top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  color: var(--text-tertiary);
  pointer-events: none;
}
.hero__kbd {
  position: absolute;
  right: var(--s-3);
  top: 50%;
  transform: translateY(-50%);
  display: none;
  align-items: center;
  gap: 2px;
  padding: 3px 6px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-quat);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
}
@media (min-width: 768px) { .hero__kbd { display: inline-flex; } }

/* ============================================================
   FILTER TABS
   ============================================================ */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-2);
  padding: var(--s-2);
  margin: var(--s-8) 0;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-md);
  container-type: inline-size;
}
.filter {
  position: relative;
  padding: var(--s-2) var(--s-4);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--text-secondary);
  border-radius: var(--r-sm);
  transition: color var(--t-fast), background-color var(--t-fast);
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  min-height: 36px;
}
.filter:hover { color: var(--text-primary); background: var(--bg-elevated); }
.filter[aria-pressed="true"] {
  color: var(--bg-base);
  background: var(--text-primary);
}
.filter__count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  opacity: 0.6;
}
@container (max-width: 540px) {
  .filter { padding: var(--s-2) var(--s-3); font-size: var(--fs-xs); }
}

/* ============================================================
   CARD GRID
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
  gap: var(--s-5);
  margin-bottom: var(--s-16);
}

/* ── CARD ── */
.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
  padding: var(--s-6);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  overflow: hidden;
  isolation: isolate;
  text-align: left;
  cursor: pointer;
  transition:
    transform var(--t-med) var(--ease-out),
    border-color var(--t-med) var(--ease-out),
    background-color var(--t-med) var(--ease-out);
  min-height: 44px;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--card-gradient, transparent);
  opacity: 0;
  transition: opacity var(--t-med) var(--ease-out);
}
.card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in oklab, var(--accent) 35%, var(--border-default));
  background: var(--bg-elevated);
}
.card:hover::before { opacity: 1; }
.card:active { transform: translateY(-2px) scale(0.99); }
.card:focus-visible { outline-offset: 4px; }

.card__cat {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  align-self: flex-start;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-radius: 9999px;
  background: color-mix(in oklab, var(--cat-color, var(--cat-default)) 15%, transparent);
  color: var(--cat-color, var(--cat-default));
  border: 1px solid color-mix(in oklab, var(--cat-color, var(--cat-default)) 30%, transparent);
}
.card__cat::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cat-color, var(--cat-default));
  box-shadow: 0 0 6px var(--cat-color, var(--cat-default));
}

.card__title {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: var(--fs-xl);
  line-height: var(--lh-snug);
  color: var(--text-primary);
  letter-spacing: -0.01em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card__desc {
  font-size: var(--fs-sm);
  line-height: var(--lh-base);
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  margin-top: auto;
  padding-top: var(--s-3);
  border-top: 1px dashed var(--border-subtle);
}
.card__date {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
}
.card__arrow {
  display: inline-flex;
  align-items: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-base);
  color: var(--text-secondary);
  transition: transform var(--t-med) var(--ease-spring), color var(--t-fast), background-color var(--t-fast);
}
.card:hover .card__arrow {
  background: var(--accent);
  color: var(--bg-base);
  transform: translateX(4px) rotate(-45deg);
}

/* ── FEATURED CARD ── */
.card--featured {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s-5);
  padding: var(--s-10) var(--s-8);
  background:
    radial-gradient(ellipse at top right, var(--accent-soft), transparent 60%),
    var(--bg-surface);
  border-color: color-mix(in oklab, var(--accent) 25%, var(--border-default));
}
@media (min-width: 720px) {
  .card--featured { grid-template-columns: 1.4fr 1fr; align-items: center; }
}
.card--featured .card__title { font-size: var(--fs-3xl); -webkit-line-clamp: 3; line-clamp: 3; }
.card--featured .card__desc  { font-size: var(--fs-base); -webkit-line-clamp: 3; line-clamp: 3; }
.card--featured .card__foot  { grid-column: 1 / -1; border-top: 1px solid var(--border-subtle); padding-top: var(--s-4); }
.card--featured .card__visual {
  position: relative;
  aspect-ratio: 16 / 10;
  border-radius: var(--r-md);
  overflow: hidden;
  background:
    linear-gradient(135deg,
      color-mix(in oklab, var(--accent) 30%, transparent),
      color-mix(in oklab, var(--accent-3) 30%, transparent));
  border: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card--featured .card__visual::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.20), transparent 50%),
    radial-gradient(circle at 70% 80%, rgba(255,255,255,0.10), transparent 50%);
}
.card--featured .card__visual-text {
  font-family: var(--font-serif);
  font-size: var(--fs-2xl);
  color: rgba(255,255,255,0.9);
  text-align: center;
  padding: var(--s-4);
  z-index: 1;
}

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty {
  text-align: center;
  padding: var(--s-16) var(--s-4);
  color: var(--text-tertiary);
}
.empty__icon { font-size: 3rem; margin-bottom: var(--s-4); opacity: 0.4; }
.empty__title { font-family: var(--font-serif); font-size: var(--fs-xl); color: var(--text-secondary); margin-bottom: var(--s-2); }

/* ============================================================
   POST VIEW
   ============================================================ */
.post {
  width: var(--container-reading);
  margin: 0 auto;
  padding: var(--s-12) 0 var(--s-20);
}
.post__back {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: var(--s-2) var(--s-3) var(--s-2) var(--s-2);
  font-size: var(--fs-sm);
  color: var(--text-secondary);
  border-radius: var(--r-sm);
  margin-bottom: var(--s-8);
  min-height: 44px;
  transition: color var(--t-fast), background-color var(--t-fast);
}
.post__back:hover { color: var(--accent); background: var(--bg-surface); }
.post__back svg { width: 16px; height: 16px; transition: transform var(--t-med) var(--ease-spring); }
.post__back:hover svg { transform: translateX(-3px); }

.post__header { margin-bottom: var(--s-10); }
.post__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-3);
  margin-bottom: var(--s-5);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  letter-spacing: 0.05em;
}
.post__meta-dot { width: 3px; height: 3px; background: var(--text-quat); border-radius: 50%; }
.post__cat {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: 3px 10px;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-radius: 9999px;
  background: color-mix(in oklab, var(--cat-color, var(--cat-default)) 15%, transparent);
  color: var(--cat-color, var(--cat-default));
  border: 1px solid color-mix(in oklab, var(--cat-color, var(--cat-default)) 30%, transparent);
}
.post__title {
  font-family: var(--font-serif);
  font-weight: 900;
  font-size: var(--fs-4xl);
  line-height: var(--lh-tight);
  letter-spacing: -0.03em;
  color: var(--text-primary);
  margin-bottom: var(--s-4);
}
.post__desc {

/* ── Prose — article body styling ── */
.prose {

}
.prose > * + * { margin-top: 1.25em; }

<!-- ===================== APP ===================== -->
<script>
/* ============================================================
   MANIFEST — all markdown files in the repo
   ============================================================ */
const MD_FILES = [
  "Agent Scope 学习笔记.md",
  "ChatGPT Dreaming.md",
  "Claude Agent Sdk学习笔记.md",
  "Claude Code 第二轮会话 400 问题修复复盘.md",
  "DevSpace MCP 配置指南.md",
  "EDF文件原理图小白解读.md",
  "EDIF JSON 从 343M 到 22M：两次无损瘦身的原理与流程.md",
  "Harnes 团队.md",
  "HTML 结合 Playwright 转换为图片的工作流程.md",
  "Hermes父子智能体系统学习指南（优化版）.md",
  "Lang Graph学习笔记.md",
  "Matt Pocock Skills 完全指南.md",
  "PDF Drawing Diff Skill 解析.md",
  "PostgreSQL 容器 COPY FROM PROGRAM 攻击处置复盘与加固指南.md",
  "Wrench-Board.md",
  "Wrench-Board 学习笔记.md",
  "ZTE SCM 滑块验证码自动化 — 实现记录.md",
  "read_file 工具详解.md",
  "原理图 AI 评审方案.md",
  "基金分析系统升级记：从简陋计算器到智能投顾.md",
  "大语言模型中的提示词缓存技术详解.md",
  "记忆优化方案.md",
];

/* Category inference: filename → { slug, label, color } */
const CATEGORY_RULES = [
  { test: /ChatGPT|Claude Code|Claude Agent|DevSpace|MCP|Hermes|Wrench-Board|Harnes|Lang Graph|Matt Pocock|Agent Scope|记忆|read_file|提示词缓存|父子智能体/, cat: { slug: "ai",      label: "AI / Agent",  color: "var(--cat-ai)" } },
  { test: /EDF|EDIF|原理图|PDF Drawing/,                  cat: { slug: "eda",     label: "原理图 / EDA", color: "var(--cat-eda)" } },
  { test: /PostgreSQL|ZTE|安全|加固|攻击/,                 cat: { slug: "security",label: "安全 / 运维",  color: "var(--cat-security)" } },
  { test: /HTML|Playwright|工作流/,                       cat: { slug: "tool",    label: "工具 / 工作流", color: "var(--cat-tool)" } },
  { test: /基金|金融|投顾/,                                cat: { slug: "finance", label: "金融",         color: "var(--cat-finance)" } },
];
function inferCategory(name) {
  for (const r of CATEGORY_RULES) if (r.test.test(name)) return r.cat;
  return { slug: "other", label: "其他", color: "var(--cat-default)" };
}
function normalizeCategory(c) {
  if (!c) return { slug: "other", label: "其他", color: "var(--cat-default)" };
  if (typeof c === "object") return c;
  const matched = CATEGORY_RULES.find(r => r.cat.label === c);
  if (matched) return matched.cat;
  return { slug: String(c), label: String(c), color: "var(--cat-default)" };
}

/* ============================================================
   UTILITIES
   ============================================================ */
function parseFrontmatter(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { data: {}, body: text };
  try {
    return { data: jsyaml.load(m[1]) || {}, body: m[2] };
  } catch {
    return { data: {}, body: text };
  }
}
function extractTitleFromBody(body) {
  const m = body.match(/^\s*<title>(.*?)<\/title>/m) || body.match(/^\s*#\s+(.+)$/m);
  return m ? m[1].trim() : null;
}
function formatDate(input) {
  if (!input) return null;
  const d = input instanceof Date ? input : new Date(input);
  if (isNaN(d.getTime())) return String(input);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  return `${y}-${m}`;
}
function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function toSlug(name) {
  return name.replace(/\.md$/, "").trim();
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
  manifest: [],     // [{ slug, file, title, date, desc, tags, category, body }]
  filter: "all",
  query: "",
  loaded: false,
};

/* ============================================================
   LOADER — fetch all md files in parallel
   ============================================================ */
async function loadManifest() {
  const results = await Promise.all(MD_FILES.map(async (file) => {
    try {
      const res = await fetch(encodeURI(file));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const { data, body } = parseFrontmatter(text);
      const inferred = inferCategory(file);
      const title = data.title || extractTitleFromBody(body) || toSlug(file);
      const desc  = data.desc || data.description || "";
      const tags  = data.tags || [];
      const date  = formatDate(data.date);
      const category = normalizeCategory(data.category || inferred);
      return { file, slug: data.slug || toSlug(file), title, date, desc, tags, category, body };
    } catch (err) {
      console.error("Failed to load", file, err);
      return { file, slug: toSlug(file), title: toSlug(file), date: null, desc: "", tags: [], category: inferCategory(file), body: "", error: true };
    }
  }));

  // Sort by date desc; undated go last
  results.sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return b.date.localeCompare(a.date);
  });
  state.manifest = results;
  state.loaded = true;
}

/* ============================================================
   RENDERING — home view
   ============================================================ */
function renderFilters() {
  const el = document.getElementById("filters");
  const counts = { all: state.manifest.length };
  for (const m of state.manifest) {
    counts[m.category.slug] = (counts[m.category.slug] || 0) + 1;
  }
  const cats = Array.from(new Map(state.manifest.map(m => [m.category.slug, m.category])).values());

  const items = [
    { slug: "all", label: "全部", color: "var(--text-primary)" },
    ...cats,
  ];

  el.innerHTML = items.map(c => `
    <button class="filter" role="tab" data-slug="${escapeHTML(c.slug)}" aria-pressed="${state.filter === c.slug}">
      <span>${escapeHTML(c.label)}</span>
      <span class="filter__count">${counts[c.slug] || 0}</span>
    </button>
  `).join("");

  el.querySelectorAll(".filter").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.slug;
      el.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed", b.dataset.slug === state.filter));
      renderGrid();
    });
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const q = state.query.trim().toLowerCase();

  let items = state.manifest.slice();
  if (state.filter !== "all") items = items.filter(m => m.category.slug === state.filter);
  if (q) {
    items = items.filter(m => {
      const hay = [m.title, m.desc, m.date, ...(m.tags || []), m.category.label].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  if (items.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column: 1 / -1;">
        <div class="empty__icon">🌿</div>
        <div class="empty__title">没有匹配的文章</div>
        <div>试试别的关键词或分类</div>
      </div>`;
    return;
  }

  const arrow = `<svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
  const dateStr = m => m.date ? `<time class="card__date" datetime="${escapeHTML(m.date)}">${escapeHTML(m.date)}</time>` : "";

  const html = items.map((m, i) => {
    const slug = encodeURIComponent(m.slug);
    const catColor = m.category.color;
    const tags = m.tags?.length
      ? m.tags.slice(0, 3).map(t => `<span class="card__tag" style="font-size:0.7rem;padding:2px 8px;">${escapeHTML(t)}</span>`).join("")
      : "";
    if (i === 0 && state.filter === "all" && !q) {
      return `
        <a class="card card--featured" href="#/doc/${slug}" aria-label="${escapeHTML(m.title)}">
          <div>
            <span class="card__cat" style="--cat-color:${catColor};">${escapeHTML(m.category.label)}</span>
            <h3 class="card__title" style="margin-top:1rem;">${escapeHTML(m.title)}</h3>
            <p class="card__desc">${escapeHTML(m.desc || "暂无简介")}</p>
            <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.8rem;">${tags}</div>
          </div>
          <div class="card__visual" aria-hidden="true">
            <span class="card__visual-text">${escapeHTML(m.title.slice(0, 8))}</span>
          </div>
          <div class="card__foot">
            ${dateStr(m)}
            ${arrow}
          </div>
        </a>`;
    }
    return `
      <a class="card" href="#/doc/${slug}" aria-label="${escapeHTML(m.title)}">
        <span class="card__cat" style="--cat-color:${catColor};">${escapeHTML(m.category.label)}</span>
        <h3 class="card__title">${escapeHTML(m.title)}</h3>
        <p class="card__desc">${escapeHTML(m.desc || "暂无简介")}</p>
        <div class="card__foot">
          ${dateStr(m)}
          ${arrow}
        </div>
      </a>`;
  }).join("");

  grid.innerHTML = html;
}

/* ============================================================
   RENDERING — post view
   ============================================================ */
async function openPost(slug) {
  const m = state.manifest.find(x => x.slug === slug || x.file === slug);
  if (!m) {
    showHome();
    return;
  }
  document.getElementById("postTitle").textContent = m.title;
  document.getElementById("postDesc").textContent  = m.desc || "";
  document.getElementById("postMeta").innerHTML = `
    <span class="post__cat" style="--cat-color:${m.category.color};">${escapeHTML(m.category.label)}</span>
    ${m.date ? `<span class="post__meta-dot"></span><span>${escapeHTML(m.date)}</span>` : ""}
    ${m.tags?.length ? `<span class="post__meta-dot"></span><span>${m.tags.length} 个标签</span>` : ""}
  `;
  document.getElementById("postTags").innerHTML = (m.tags || [])
    .map(t => `<span class="post__tag">${escapeHTML(t)}</span>`).join("");

  document.getElementById("postContent").innerHTML =
    '<div class="skeleton skeleton-card"></div>';

  // Post navigation
  const idx = state.manifest.findIndex(x => x.slug === m.slug);
  const prev = idx > 0 ? state.manifest[idx - 1] : null;
  const next = idx < state.manifest.length - 1 ? state.manifest[idx + 1] : null;
  document.getElementById("postNav").innerHTML = `
    <a class="post__nav-link ${prev ? "" : "post__nav-link--disabled"}" href="${prev ? `#/doc/${encodeURIComponent(prev.slug)}` : "#"}" aria-label="上一篇文章">
      <span class="post__nav-label">← 上一篇</span>
      <span class="post__nav-title">${escapeHTML(prev ? prev.title : "已是第一篇")}</span>
    </a>
    <a class="post__nav-link post__nav-link--next ${next ? "" : "post__nav-link--disabled"}" href="${next ? `#/doc/${encodeURIComponent(next.slug)}` : "#"}" aria-label="下一篇文章">
      <span class="post__nav-label">下一篇 →</span>
      <span class="post__nav-title">${escapeHTML(next ? next.title : "已是最后一篇")}</span>
    </a>`;

  // Markdown render
  let rawHtml = marked.parse(m.body || "*(空内容)*", {
    gfm: true,
    breaks: true,
    mangle: false,
    headerIds: true,
  });
  rawHtml = rawHtml.replace(/<img\s+src="([^"]+)"/g, (_m, src) =>
    `<img src="${src.split('/').map(encodeURIComponent).join('/')}"`
  );
  const html = DOMPurify.sanitize(rawHtml);
  document.getElementById("postContent").innerHTML = html;
  window.scrollTo({ top: 0, behavior: "instant" });
  document.title = `${m.title} · 藤椒斋`;

  // Open external links in new tab
  document.getElementById("postContent").querySelectorAll("a[href]").forEach(a => {
    if (/^https?:\/\//.test(a.href)) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
  });
}

function showHome() {
  document.getElementById("home-view").hidden = false;
  document.getElementById("post-view").hidden = true;
  document.title = "藤椒斋 · 个人知识库";
  window.scrollTo({ top: 0, behavior: "instant" });
}
function showPost() {
  document.getElementById("home-view").hidden = true;
  document.getElementById("post-view").hidden = false;
}

/* ============================================================
   ROUTER — hash-based
   ============================================================ */
function router() {
  const h = location.hash;
  if (h.startsWith("#/doc/")) {
    const slug = decodeURIComponent(h.slice(6));
    showPost();
    openPost(slug);
  } else {
    showHome();
  }
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  // Skeleton placeholders while loading
  const grid = document.getElementById("grid");
  grid.innerHTML = Array(4).fill('<div class="skeleton skeleton-card"></div>').join("");

  await loadManifest();
  renderFilters();
  renderGrid();
  router();
}

/* Search input */
document.addEventListener("input", (e) => {
  if (e.target.id === "searchInput") {
    state.query = e.target.value;
    renderGrid();
  }
});

/* Keyboard: ⌘K / Ctrl+K → focus search, T → toggle theme, Esc → home */
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  } else if (e.key.toLowerCase() === "t" && !e.target.matches("input, textarea")) {
    toggleTheme();
  } else if (e.key === "Escape") {
    if (!document.getElementById("post-view").hidden) location.hash = "#/";
    else document.getElementById("searchInput").blur();
  }
});

/* Theme toggle */
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === "dark" ? "light" : "dark";
  html.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
}
document.getElementById("themeToggle").addEventListener("click", toggleTheme);
try {
  const saved = localStorage.getItem("theme");
  if (saved) document.documentElement.dataset.theme = saved;
} catch {}

/* Router events */
window.addEventListener("hashchange", router);

/* Boot — wait for libs to be ready */
if (typeof marked === "undefined" || typeof jsyaml === "undefined" || typeof DOMPurify === "undefined") {
  // libs loaded with `defer`, so they should be available, but be defensive
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
